[project]
name = "real-travel-cost"
version = "0.1.0"
description = "Near-real-time cost of travel abroad, adjusted for exchange rates and inflation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyarrow>=14",
    "requests>=2.31",
    "lxml>=5.0",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.0", "ipykernel>=6.29"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/real_travel_cost"]

[tool.ruff]
line-length = 100
# Superseded one-file version, kept only for reference against a retired IMF API.
extend-exclude = ["2023-11-01 Exchange Rates.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run stays offline; the agreement check against the live World Bank series is
# opt-in via `uv run pytest -m network`.
addopts = "-m 'not network'"
markers = ["network: hits live upstream APIs"]
